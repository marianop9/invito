{{ define "partial_timeline" }}
{{ if .Section.Items }}
<section class="inv-section inv-timeline-section inv-block {{ .SurfaceClass }}" id="section-timeline">
  <div class="inv-block-icon" aria-hidden="true">
    {{ icon "calendar-plus" }}
  </div>
  <h3 class="inv-block-title">{{ if .Section.Title }}{{ .Section.Title }}{{ else }}Cronograma{{ end }}</h3>

  <div class="timeline-track-container">
    <div class="timeline-track-line" aria-hidden="true"></div>
    <div class="timeline-nodes">
      {{ range .Section.Items }}
        <div class="timeline-node-item">
          <div class="timeline-marker" aria-hidden="true">
            <span class="timeline-dot"></span>
          </div>
          <div class="timeline-node-body">
            <span class="timeline-time">{{ .Time }}</span>
            <div class="timeline-title">{{ .Title }}</div>
            {{ if .Description }}
              <div class="timeline-desc">{{ .Description }}</div>
            {{ end }}
          </div>
        </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
{{ end }}
