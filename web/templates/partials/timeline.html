{{ define "partial_timeline" }}
{{ if .Section.Items }}
<div class="inv-section" id="section-timeline">
  <div class="inv-section-heading">{{ if .Section.Title }}{{ .Section.Title }}{{ else }}Schedule{{ end }}</div>

  <ul class="timeline-compact">
    {{ range .Section.Items }}
      <li class="timeline-compact-item">
        <span class="timeline-time-badge">{{ .Time }}</span>
        <div class="timeline-compact-content">
          <div class="timeline-compact-title">{{ .Title }}</div>
          {{ if .Description }}
            <div class="timeline-compact-desc">{{ .Description }}</div>
          {{ end }}
        </div>
      </li>
    {{ end }}
  </ul>
</div>
{{ end }}
{{ end }}
