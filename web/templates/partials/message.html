{{ define "partial_message" }}
<section class="inv-section inv-message-section" id="section-message">
  <blockquote class="inv-message-block">
    <p class="inv-message-text">&ldquo;{{ .Section.Text }}&rdquo;</p>
    {{ if .Section.Author }}
      <cite class="inv-message-author">&mdash; {{ .Section.Author }}</cite>
    {{ end }}
  </blockquote>
</section>
{{ end }}
