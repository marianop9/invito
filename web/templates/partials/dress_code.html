{{ define "partial_dress_code" }}
  {{ if .Section.Title }}
  <div class="inv-section" id="section-dress-code">
    <div class="inv-section-heading">{{ .Section.Title }}</div>
    <div class="dress-code-compact">
      <div class="dress-code-header">
        <span class="dress-code-title">{{ .Section.Name }}</span>
        {{ if .Section.PaletteHints }}
          <div class="swatches-inline" title="Palette suggestions">
            {{ range .Section.PaletteHints }}
              <span class="swatch-dot" style="background-color: {{ . }};"></span>
            {{ end }}
          </div>
        {{ end }}
      </div>

      {{ if .Section.Description }}
        <p class="dress-code-desc">{{ .Section.Description }}</p>
      {{ end }}
    </div>
  </div>
  {{ end }}
{{ end }}
