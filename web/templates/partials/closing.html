{{ define "partial_closing" }}
<section class="inv-section inv-closing-section" id="section-closing">
  <div class="inv-closing-content">
    {{ if .Section.Message }}
      <p class="inv-closing-message">{{ .Section.Message }}</p>
    {{ end }}
    {{ if .Section.Signoff }}
      <p class="inv-closing-signoff">{{ .Section.Signoff }}</p>
    {{ end }}
    <p class="inv-closing-hosts">{{ .Section.DisplayHosts .Invitation.HostsDisplay }}</p>
  </div>
</section>
{{ end }}
