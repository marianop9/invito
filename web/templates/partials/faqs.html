{{ define "partial_faqs" }}
{{ if .Section.Items }}
<div class="inv-section inv-faqs-section" id="section-faqs">
  <div class="inv-section-heading">{{ if .Section.Title }}{{ .Section.Title }}{{ else }}Preguntas Frecuentes{{ end }}</div>

  <div class="faq-accordion-list">
    {{ range .Section.Items }}
      <details class="faq-accordion-item">
        <summary class="faq-accordion-summary">
          <span class="faq-accordion-question">{{ .Question }}</span>
          <span class="faq-accordion-chevron" aria-hidden="true">{{ icon "chevron-down" }}</span>
        </summary>
        <div class="faq-accordion-content">
          <p>{{ .Answer }}</p>
        </div>
      </details>
    {{ end }}
  </div>
</div>
{{ end }}
{{ end }}
