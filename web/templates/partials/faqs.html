{{ define "partial_faqs" }}
{{ if .Section.Items }}
<section class="inv-section inv-faqs-section inv-block {{ .SurfaceClass }}" id="section-faqs">
  <h3 class="inv-block-heading">{{ if .Section.Title }}{{ .Section.Title }}{{ else }}PREGUNTAS FRECUENTES{{ end }}</h3>

  <div class="faq-accordion-list">
    {{ range .Section.Items }}
      <details class="faq-accordion-item" name="inv-faqs">
        <summary class="faq-accordion-summary">
          <span class="faq-accordion-question">{{ .Question }}</span>
          <span class="faq-accordion-chevron" aria-hidden="true">{{ icon "chevron-down" }}</span>
        </summary>
        <div class="faq-accordion-content">
          <p>{{ .Answer }}</p>
        </div>
      </details>
    {{ end }}
  </div>
</section>
{{ end }}
{{ end }}
