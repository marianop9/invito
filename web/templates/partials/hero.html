{{ define "partial_hero" }}
<div class="inv-hero{{ if .Section.HasCoverImage }} has-cover-image{{ end }}" id="section-hero">
  {{ if .Section.HasCoverImage }}
    <div class="inv-hero-media">
      <img src="{{ .Section.CoverImageURL }}" alt="{{ .Invitation.Title }}" class="inv-hero-img" loading="eager" decoding="async">
      <div class="inv-hero-overlay"></div>
    </div>
  {{ end }}

  <div class="inv-hero-content">
    {{ if .Section.Eyebrow }}
      <div class="inv-eyebrow">{{ .Section.Eyebrow }}</div>
    {{ end }}

    <h1 class="inv-title">{{ .Invitation.Title }}</h1>

    {{ if .Section.ShowCountdown }}
    <!-- Prominent Celebratory Countdown Block -->
    <div class="inv-countdown" id="inv-countdown" data-target-date="{{ .Invitation.DateStart.Format "2006-01-02T15:04:05Z07:00" }}">
      <div class="countdown-unit">
        <span class="countdown-value" id="cd-days">--</span>
        <span class="countdown-label">DÍAS</span>
      </div>
      <span class="countdown-separator" aria-hidden="true">:</span>
      <div class="countdown-unit">
        <span class="countdown-value" id="cd-hours">--</span>
        <span class="countdown-label">HORAS</span>
      </div>
      <span class="countdown-separator" aria-hidden="true">:</span>
      <div class="countdown-unit">
        <span class="countdown-value" id="cd-mins">--</span>
        <span class="countdown-label">MIN</span>
      </div>
      <span class="countdown-separator" aria-hidden="true">:</span>
      <div class="countdown-unit">
        <span class="countdown-value" id="cd-secs">--</span>
        <span class="countdown-label">SEG</span>
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
